# Included at server level and in every location that sets its own add_header
# (nginx drops inherited add_header directives once a location defines one).
# Cloudflare Web Analytics injects its beacon, so its two hosts are allowed.
# Cloudflare's JavaScript Detections injects an inline script; it copies the
# nonce from this header onto it ($request_id: 128 random bits per request).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
