# Static site served inside the easy-homepage container.

# One line per page open, for the visitor counter. The sync job reads this file
# every 5 minutes, keeps only keyed hashes of the IPs, and truncates it.
# The X-Visitor-* headers are set by the host proxy, and only for requests from
# Cloudflare: IP, then country and region from Cloudflare's location headers.
# New fields go after the user agent so older lines still parse.
log_format mosu_visits '$time_iso8601\t$http_x_visitor_ip\t$http_user_agent\t$http_x_visitor_country\t$http_x_visitor_region_code\t$http_x_visitor_region';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Data from the 5-minute sync (mounted read-only). Only these public files
    # are served; the counter's key and state in the same directory never are.
    location ~ ^/data/((live|status)\.json)$ {
        alias /usr/share/nginx/live/$1;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location /data/ {
        return 404;
    }

    # Must revalidate so new releases reach users.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Every page open ends here (the SPA fallback below redirects to it).
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        access_log /var/log/nginx/access.log;
        access_log /var/log/visits/visits.log mosu_visits;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
