# Host reverse proxy (my-nginx4, host networking) -> easy-homepage container.
# Installed as /root/nginx/conf.d/mosu-homepage.conf. Keep the file name sorting
# after easy-novel-dev.conf so it does not become the default 443 server.

# Visitor counting: trust CF-Connecting-IP and Cloudflare's location headers
# (CF-IPCountry, plus CF-Region* when "Add visitor location headers" is on)
# only when the request really came from Cloudflare, so a direct hit on the
# origin can't fake visitors or where they're from.
# No `map` here: this file sorts before qwentts.conf, which sets
# map_hash_bucket_size, and an earlier map block makes that a duplicate.
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (2026-10-21).
geo $mosu_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 443 ssl;
    server_name mosuyang.org;

    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        set $mosu_visitor_ip "";
        set $mosu_visitor_country "";
        set $mosu_visitor_region_code "";
        set $mosu_visitor_region "";
        if ($mosu_from_cloudflare) {
            set $mosu_visitor_ip $http_cf_connecting_ip;
            set $mosu_visitor_country $http_cf_ipcountry;
            set $mosu_visitor_region_code $http_cf_region_code;
            set $mosu_visitor_region $http_cf_region;
        }
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Always overwritten, so client-sent X-Visitor-* headers never get through.
        proxy_set_header X-Visitor-IP $mosu_visitor_ip;
        proxy_set_header X-Visitor-Country $mosu_visitor_country;
        proxy_set_header X-Visitor-Region-Code $mosu_visitor_region_code;
        proxy_set_header X-Visitor-Region $mosu_visitor_region;
    }
}
