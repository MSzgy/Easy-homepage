# Host reverse proxy (my-nginx4, host networking) -> easy-homepage container.
# Installed as /root/nginx/conf.d/mosu-homepage.conf. Keep the file name sorting
# after easy-novel-dev.conf so it does not become the default 443 server.
server {
    listen 443 ssl;
    server_name mosuyang.org;

    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
